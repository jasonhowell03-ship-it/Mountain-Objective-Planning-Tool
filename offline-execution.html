<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#17374d"><title>Offline Execution / AAR</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;background:#eef3f5;color:#17374d}.app{max-width:760px;margin:auto;padding:14px}.head{background:#17374d;color:#fff;padding:18px;border-radius:14px}.card{background:#fff;border-radius:14px;padding:14px;margin:10px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}label{font-size:12px;font-weight:800}input,select,textarea{width:100%;box-sizing:border-box;padding:12px;margin:5px 0 10px;border:1px solid #bccbd2;border-radius:9px;font-size:16px}textarea{min-height:90px}.btn{width:100%;border:0;border-radius:10px;padding:14px;background:#17374d;color:#fff;font-weight:800;font-size:15px}.secondary{background:#dfe9ed;color:#17374d}.entry{border-top:1px solid #dce5e9;padding-top:12px;margin-top:12px}.small{font-size:12px;color:#60717a}.status{text-align:center;font-size:12px;color:#526875;margin:10px}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style></head><body><div class="app"><div class="head"><h2 style="margin:0">OFFLINE EXECUTION / AAR</h2><div>Mountain Objective Field Companion</div><div style="font-size:12px;margin-top:8px">Open and load this page before leaving coverage. Entries auto-save on this phone.</div></div><div class="card"><div class="grid"><div><label>OBJECTIVE</label><input id="objective"></div><div><label>DATE(S)</label><input id="dates"></div><div><label>LOCATION / ROUTE</label><input id="location"></div><div><label>TEAM LEAD</label><input id="lead"></div></div><label>PRIMARY HAZARD / MOST DANGEROUS PART</label><textarea id="hazard"></textarea><label>ABORT / TURNAROUND CRITERIA</label><textarea id="abort"></textarea><label>CONTINGENCY / RETREAT</label><textarea id="cont"></textarea><label>MEDICAL / COMMUNICATIONS</label><textarea id="med"></textarea></div><div class="card"><h3>Execution Entry</h3><div class="grid"><div><label>TIME</label><input id="time" type="time"></div><div><label>TYPE</label><select id="type"><option>Movement</option><option>Decision Point</option><option>Hazard</option><option>Weather</option><option>Medical</option><option>Equipment</option><option>Navigation</option><option>AAR / Observation</option></select></div></div><label>LOCATION / WAYPOINT</label><input id="waypoint"><label>CONDITIONS / DECISION / ACTION / OBSERVATION</label><textarea id="note"></textarea><label>PHOTO REFERENCE / FILENAME</label><input id="photo"><label>GPS / MAP REFERENCE</label><input id="gps"><button class="btn" onclick="addEntry()">ADD OFFLINE ENTRY</button></div><div id="entries"></div><div class="card"><h3>After Action Review</h3><label>SUSTAIN — WHAT WORKED</label><textarea id="sustain"></textarea><label>IMPROVE — WHAT SHOULD CHANGE</label><textarea id="improve"></textarea><label>LESSONS LEARNED / RECOMMENDATIONS</label><textarea id="lessons"></textarea><label>FOLLOW-UP ACTIONS</label><textarea id="followup"></textarea></div><div class="card"><button class="btn secondary" onclick="window.print()">SAVE / PRINT OFFLINE RECORD AS PDF</button><p class="small">On iPhone: Share/Print → pinch out the preview → Share → Save to Files or Google Drive.</p></div><div id="status" class="status">Offline draft ready.</div></div><script>const KEY='mopOfflineExecution',fields=['objective','dates','location','lead','hazard','abort','cont','med','sustain','improve','lessons','followup'];let entries=[];function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;')}function data(){let o={};fields.forEach(x=>o[x]=document.getElementById(x).value);o.entries=entries;return o}function save(){try{localStorage.setItem(KEY,JSON.stringify(data()));status.textContent='Offline auto-saved · '+new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}catch(e){status.textContent='Storage full — save/print the record now.'}}function load(){try{const o=JSON.parse(localStorage.getItem(KEY));if(!o)return;fields.forEach(x=>document.getElementById(x).value=o[x]||'');entries=o.entries||[];render()}catch(e){}}function addEntry(){entries.push({time:time.value,type:type.value,waypoint:waypoint.value,note:note.value,photo:photo.value,gps:gps.value});time.value=waypoint.value=note.value=photo.value=gps.value='';render();save()}function render(){document.getElementById('entries').innerHTML=entries.map((e,i)=>`<div class="card"><div class="entry"><b>${esc(e.time)} · ${esc(e.type)}</b><br>${esc(e.waypoint)}<p>${esc(e.note)}</p><div class="small">Photo: ${esc(e.photo)}<br>GPS/Map: ${esc(e.gps)}</div><button class="btn secondary" onclick="entries.splice(${i},1);render();save()">REMOVE ENTRY</button></div></div>`).join('')}window.addEventListener('DOMContentLoaded',()=>{load();fields.forEach(x=>{const e=document.getElementById(x);e.addEventListener('input',save);e.addEventListener('change',save)})});</script></body></html>
